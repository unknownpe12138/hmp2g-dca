<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSTM-CBG DCA 离线回放器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #header {
            background: rgba(0,0,0,0.3);
            color: white;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        #header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        #header p {
            opacity: 0.9;
        }
        #controls {
            background: rgba(255,255,255,0.95);
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .control-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 15px;
        }
        .control-group label {
            font-weight: bold;
            min-width: 100px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background: #667eea;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        input[type="range"] {
            width: 300px;
        }
        input[type="file"] {
            padding: 8px;
            border: 2px dashed #667eea;
            border-radius: 5px;
            background: #f8f9fa;
        }
        #fileInfo {
            margin-top: 10px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 5px;
            display: none;
        }
        #fileInfo.error {
            background: #ffebee;
        }
        #stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .stat-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-box .value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }
        .stat-box .label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        #viewer {
            flex: 1;
            background: white;
            margin: 0 20px 20px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        #viewer iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #999;
            font-size: 18px;
        }
        .speed-control {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .speed-btn {
            padding: 5px 15px;
            font-size: 12px;
        }
        .speed-btn.active {
            background: #764ba2;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>RSTM-CBG DCA 离线回放器</h1>
        <p>基于分层角色切换与跨层桥接博弈的多智能体协同算法</p>
    </div>

    <div id="controls">
        <div class="control-group">
            <label>选择文件:</label>
            <input type="file" id="fileInput" accept=".gz">
            <button onclick="loadDefaultFile()">加载默认文件</button>
        </div>
        <div id="fileInfo"></div>

        <div class="control-group">
            <label>播放控制:</label>
            <button onclick="togglePlay()" id="playBtn">播放</button>
            <button onclick="stepForward()" id="stepBtn">单步前进</button>
            <button onclick="stepBackward()" id="stepBackBtn">单步后退</button>
            <button onclick="reset()">重置</button>
        </div>

        <div class="control-group">
            <label>进度:</label>
            <input type="range" id="frameSlider" min="0" max="100" value="0" oninput="seekTo(this.value)">
            <span id="frameInfo">0 / 0</span>
        </div>

        <div class="control-group">
            <label>速度:</label>
            <div class="speed-control">
                <button class="speed-btn" onclick="setSpeed(0.25)">0.25x</button>
                <button class="speed-btn" onclick="setSpeed(0.5)">0.5x</button>
                <button class="speed-btn active" onclick="setSpeed(1)">1x</button>
                <button class="speed-btn" onclick="setSpeed(2)">2x</button>
                <button class="speed-btn" onclick="setSpeed(4)">4x</button>
            </div>
        </div>

        <div id="stats">
            <div class="stat-box">
                <div class="value" id="totalFrames">0</div>
                <div class="label">总帧数</div>
            </div>
            <div class="stat-box">
                <div class="value" id="currentFrame">0</div>
                <div class="label">当前帧</div>
            </div>
            <div class="stat-box">
                <div class="value" id="playbackSpeed">1x</div>
                <div class="label">播放速度</div>
            </div>
        </div>
    </div>

    <div id="viewer">
        <div id="placeholder">
            <div>
                <p>请选择 backup.dp.gz 文件开始回放</p>
                <p style="font-size: 14px; margin-top: 10px;">文件位置: hmp2g-dca/TEMP/v2d_logger/backup.dp.gz</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script>
        let replayData = [];
        let currentFrame = 0;
        let isPlaying = false;
        let playInterval = null;
        let playbackSpeed = 1;

        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const frameSlider = document.getElementById('frameSlider');
        const frameInfo = document.getElementById('frameInfo');
        const playBtn = document.getElementById('playBtn');
        const placeholder = document.getElementById('placeholder');

        fileInput.addEventListener('change', handleFileSelect);

        async function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            fileInfo.style.display = 'block';
            fileInfo.className = '';
            fileInfo.innerHTML = `正在加载: ${file.name}...`;

            try {
                const data = await file.arrayBuffer();
                const decompressed = pako.ungzip(new Uint8Array(data));
                const text = new TextDecoder().decode(decompressed);
                replayData = text.split('\n').filter(line => line.trim());

                fileInfo.innerHTML = `✓ 成功加载 ${replayData.length} 帧数据`;
                initializePlayer();
            } catch (error) {
                fileInfo.className = 'error';
                fileInfo.innerHTML = `✗ 加载失败: ${error.message}<br>请确保文件是有效的 backup.dp.gz 文件`;
            }
        }

        async function loadDefaultFile() {
            fileInfo.style.display = 'block';
            fileInfo.innerHTML = '请通过文件选择器选择 TEMP/v2d_logger/backup.dp.gz 文件';
        }

        function initializePlayer() {
            if (replayData.length === 0) return;

            document.getElementById('totalFrames').textContent = replayData.length;
            frameSlider.max = replayData.length - 1;
            updateFrameDisplay();
            placeholder.innerHTML = '<div style="text-align:center;"><p style="font-size:24px;color:#667eea;">回放器已就绪</p><p>点击"播放"按钮开始回放</p></div>';
        }

        function updateFrameDisplay() {
            frameInfo.textContent = `${currentFrame} / ${replayData.length}`;
            document.getElementById('currentFrame').textContent = currentFrame;
            frameSlider.value = currentFrame;
        }

        function togglePlay() {
            if (replayData.length === 0) {
                alert('请先加载数据文件');
                return;
            }

            isPlaying = !isPlaying;
            playBtn.textContent = isPlaying ? '暂停' : '播放';

            if (isPlaying) {
                const interval = 100 / playbackSpeed;
                playInterval = setInterval(() => {
                    if (currentFrame < replayData.length - 1) {
                        currentFrame++;
                        updateFrameDisplay();
                    } else {
                        stopPlay();
                    }
                }, interval);
            } else {
                clearInterval(playInterval);
            }
        }

        function stopPlay() {
            isPlaying = false;
            playBtn.textContent = '播放';
            clearInterval(playInterval);
        }

        function stepForward() {
            if (replayData.length === 0) return;
            stopPlay();
            if (currentFrame < replayData.length - 1) {
                currentFrame++;
                updateFrameDisplay();
            }
        }

        function stepBackward() {
            if (replayData.length === 0) return;
            stopPlay();
            if (currentFrame > 0) {
                currentFrame--;
                updateFrameDisplay();
            }
        }

        function reset() {
            stopPlay();
            currentFrame = 0;
            updateFrameDisplay();
        }

        function seekTo(value) {
            stopPlay();
            currentFrame = parseInt(value);
            updateFrameDisplay();
        }

        function setSpeed(speed) {
            playbackSpeed = speed;
            document.getElementById('playbackSpeed').textContent = speed + 'x';

            // Update button styles
            document.querySelectorAll('.speed-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Restart play if playing
            if (isPlaying) {
                stopPlay();
                togglePlay();
            }
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlay();
            } else if (e.code === 'ArrowRight') {
                stepForward();
            } else if (e.code === 'ArrowLeft') {
                stepBackward();
            } else if (e.code === 'KeyR') {
                reset();
            }
        });
    </script>
</body>
</html>
